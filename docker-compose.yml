version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: cypher_postgres
    environment:
      POSTGRES_DB: cypher
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7
    container_name: cypher_redis
    ports:
      - "6380:6379"
    restart: unless-stopped

  cypher:
    build: .
    container_name: cypher_app
    depends_on:
      - postgres
      - redis
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=postgres
      - REDIS_HOST=redis
      - DB_PASSWORD=${DB_PASSWORD}
      - KEYSTORE_PASSWORD=${KEYSTORE_PASSWORD}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
    volumes:
      - ./secrets:/app/secrets
    restart: unless-stopped

volumes:
  pgdata:
