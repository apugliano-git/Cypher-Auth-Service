spring.application.name=cypher
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:5432/cypher
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}
spring.config.import=optional:file:.env[.properties]

spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}
spring.jpa.show-sql=false
spring.sql.init.mode=${SQL_INIT_MODE:never}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Keystore configuration
cypher.jwt.keystore.location=file:secrets/cypher-keystore.p12
cypher.jwt.keystore.password=${KEYSTORE_PASSWORD}
cypher.jwt.keystore.alias=cypher-key
cypher.jwt.expiration-seconds=900
cypher.jwt.refresh.expiration-days=7

# Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=6379

# Rate limit
cypher.rate-limit.max-attempts=5
cypher.rate-limit.window-minutes=5

# Anomaly Detection
cypher.anomaly.max-speed-kmh=900
cypher.anthropic.api-key=${ANTHROPIC_API_KEY:}
cypher.geoip.db-path=secrets/GeoLite2-City.mmdb

# Error Handling (Security)
server.error.include-message=never
server.error.include-stacktrace=never

# Identity contract and bounded dependency failures
cypher.jwt.issuer=${JWT_ISSUER:http://localhost:8080}
cypher.jwt.audience=keystone-ecosystem
cypher.jwt.key-id=${JWT_KEY_ID:cypher-key}
cypher.anthropic.enabled=${ANTHROPIC_ENABLED:false}
server.forward-headers-strategy=none
server.max-http-request-header-size=8KB
server.tomcat.threads.max=16
server.tomcat.threads.min-spare=2
server.tomcat.max-connections=64
server.tomcat.accept-count=32
server.tomcat.connection-timeout=5s
server.tomcat.disable-upload-timeout=false
server.tomcat.connection-upload-timeout=5s
spring.datasource.hikari.maximum-pool-size=8
spring.datasource.hikari.connection-timeout=2000
spring.datasource.hikari.data-source-properties.connectTimeout=2
spring.datasource.hikari.data-source-properties.socketTimeout=5
spring.datasource.hikari.connection-init-sql=SET statement_timeout = '3s'; SET lock_timeout = '2s'
spring.data.redis.connect-timeout=1s
spring.data.redis.timeout=1s
spring.jpa.open-in-view=false
