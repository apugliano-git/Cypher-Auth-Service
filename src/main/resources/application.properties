spring.application.name=cypher
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:5432/cypher
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}
spring.config.import=optional:file:.env[.properties]

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Keystore configuration
cypher.jwt.keystore.location=file:secrets/cypher-keystore.p12
cypher.jwt.keystore.password=${KEYSTORE_PASSWORD}
cypher.jwt.keystore.alias=cypher-key
cypher.jwt.expiration-seconds=900
cypher.jwt.refresh.expiration-days=7

# Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=6379

# Rate limit
cypher.rate-limit.max-attempts=5
cypher.rate-limit.window-minutes=5

# Anomaly Detection
cypher.anomaly.max-speed-kmh=900
cypher.anthropic.api-key=${ANTHROPIC_API_KEY:}
cypher.geoip.db-path=secrets/GeoLite2-City.mmdb

# Error Handling (Security)
server.error.include-message=never
server.error.include-stacktrace=never
